publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <5.0.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  http: ^1.2.2
  supabase_flutter: ^2.8.0
