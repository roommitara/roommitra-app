name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project
        run: flutter create --platforms=android --project-name roommitra_app --org com.roommitra out
      - name: Add Android permissions
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application#' out/android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission" out/android/app/src/main/AndroidManifest.xml
      - name: Copy app files
        run: |
          rm -rf out/lib
          cp -r lib out/lib
          cp pubspec.yaml out/pubspec.yaml
          mkdir -p out/assets
          for f in *.png *.jpg; do cp "$f" out/assets/; done
          cp file_00000000b18c8208822c12bae77db15e.png out/assets/splash.png
          cp app_logo_green.png out/assets/logo.png
      - name: Build
        working-directory: out
        run: |
          flutter pub get
          flutter build apk --release --no-shrink
      - uses: actions/upload-artifact@v4
        with:
          name: RoomMitra-APK
          path: out/build/app/outputs/flutter-apk/app-release.apk
