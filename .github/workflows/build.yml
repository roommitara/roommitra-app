name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project
        run: flutter create --platforms=android --project-name roommitra_app --org com.roommitra out
      - name: Add Android permissions
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' out/android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission" out/android/app/src/main/AndroidManifest.xml
      - name: Add Google login deep link
        run: |
          python3 - << 'PYEOF'
          p = 'out/android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          link = '<intent-filter><action android:name="android.intent.action.VIEW"/><category android:name="android.intent.category.DEFAULT"/><category android:name="android.intent.category.BROWSABLE"/><data android:scheme="roommitra" android:host="login-callback"/></intent-filter>'
          if 'login-callback' not in s:
              s = s.replace('</activity>', link + '</activity>', 1)
          open(p, 'w').write(s)
          PYEOF
          grep -c "login-callback" out/android/app/src/main/AndroidManifest.xml
      - name: Add R8 keep rules
        run: |
          cat > out/android/app/proguard-rules.pro << 'EOF'
          -keep class kotlin.Unit { *; }
          -keep class kotlin.Result { *; }
          -keep class kotlin.Result$Failure { *; }
          -keep class kotlin.coroutines.Continuation { *; }
          -keep class kotlin.coroutines.intrinsics.CoroutineSingletons { *; }
          -keep class kotlin.coroutines.intrinsics.IntrinsicsKt { *; }
          -keep class io.flutter.plugins.sharedpreferences.** { *; }
          EOF
          cat out/android/app/proguard-rules.pro
      - name: Set app icon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          ICON=app_icon.png
          if [ -f "app_icon-1.png" ]; then ICON=app_icon-1.png; fi
          echo "Using icon file: $ICON"
          RES=out/android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}
            s=${pair##*:}
            mkdir -p $RES/mipmap-$d
            if command -v magick >/dev/null 2>&1; then
              magick "$ICON" -resize ${s}x${s} $RES/mipmap-$d/ic_launcher.png
            else
              convert "$ICON" -resize ${s}x${s} $RES/mipmap-$d/ic_launcher.png
            fi
          done
          ls -l $RES/mipmap-*/ic_launcher.png
      - name: Add Firebase (push notifications)
        run: |
          if [ ! -f google-services.json ]; then echo "No google-services.json, skipping"; exit 0; fi
          cp google-services.json out/android/app/google-services.json
          RES=out/android/app/src/main/res
          mkdir -p $RES/drawable $RES/values
          # छोटा सफ़ेद घर वाला नोटिफिकेशन आइकन (Android सिर्फ सफ़ेद आकार दिखाता है)
          convert -size 96x96 xc:none -fill white -draw "polygon 48,10 86,46 76,46 76,84 20,84 20,46 10,46" $RES/drawable/ic_stat_notify.png
          cat > $RES/values/colors_notify.xml << 'EOF2'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="notify_color">#1B8A5A</color></resources>
          EOF2
          python3 - << 'PYEOF'
          import re, os
          man = 'out/android/app/src/main/AndroidManifest.xml'
          s = open(man).read()
          meta = '<meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_notify"/><meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/notify_color"/>'
          if 'default_notification_icon' not in s:
              s = s.replace('</application>', meta + '</application>', 1)
          open(man, 'w').write(s)
          plug = '4.4.2'
          for name in ['settings.gradle.kts', 'settings.gradle']:
              p = 'out/android/' + name
              if not os.path.exists(p): continue
              t = open(p).read()
              if 'google-services' in t: break
              if name.endswith('.kts'):
                  t = re.sub(r'(plugins\s*\{)', r'\1\n    id("com.google.gms.google-services") version "%s" apply false' % plug, t, count=1)
              else:
                  t = re.sub(r'(plugins\s*\{)', r"\1\n    id 'com.google.gms.google-services' version '%s' apply false" % plug, t, count=1)
              open(p, 'w').write(t)
              break
          for name in ['build.gradle.kts', 'build.gradle']:
              p = 'out/android/app/' + name
              if not os.path.exists(p): continue
              t = open(p).read()
              if 'google-services' in t: break
              if name.endswith('.kts'):
                  t = re.sub(r'(plugins\s*\{)', r'\1\n    id("com.google.gms.google-services")', t, count=1)
              else:
                  t = re.sub(r'(plugins\s*\{)', r"\1\n    id 'com.google.gms.google-services'", t, count=1)
              open(p, 'w').write(t)
              break
          PYEOF
          grep -n "google" out/android/settings.gradle* out/android/app/build.gradle*
      - name: Copy app files
        run: |
          rm -rf out/lib
          cp -r lib out/lib
          cp pubspec.yaml out/pubspec.yaml
          mkdir -p out/assets
          for f in *.png *.jpg; do cp "$f" out/assets/; done
          for f in guide_*.mp4; do [ -f "$f" ] && cp "$f" out/assets/ || true; done
          [ -f intro.mp4 ] && cp intro.mp4 out/assets/ || true
          cp file_00000000b18c8208822c12bae77db15e.png out/assets/splash.png
          cp app_logo_green.png out/assets/logo.png
      - name: Use fixed signing key (so updates install over old app)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            mkdir -p ~/.android
            echo "$KS_B64" | base64 -d > ~/.android/debug.keystore
            echo "Fixed signing key installed"
          else
            echo "No ANDROID_KEYSTORE_B64 secret, using random key"
          fi
      - name: Build
        working-directory: out
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: RoomMitra-APK
          path: out/build/app/outputs/flutter-apk/app-release.apk
